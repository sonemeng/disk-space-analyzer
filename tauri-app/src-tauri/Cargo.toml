[package]
name = "disk-analyzer"
version = "5.1.0"
description = "Modern disk space analyzer with Vue 3 UI"
authors = ["songmeng <songmeng@hotmail.com>"]
license = "MIT"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
chrono = "0.4"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
