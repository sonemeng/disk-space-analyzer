[package]
name = "disk-analyzer"
version = "6.2.1"
description = "Modern disk space analyzer with Vue 3 UI"
authors = ["songmeng <songmeng@hotmail.com>"]
license = "MIT"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
chrono = "0.4"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
base64 = "0.22"
img_hash = "3.2"
image = { version = "0.23.14", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
lofty = "0.22"
rayon = "1.10"
trash = "5.2"
semver = "1.0"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
tauri-build = { version = "2", features = [] }
